name: Public demo

on:
  push:
    branches: [main]
    paths: ["worker/frontend/**", "worker/public/**", "worker/package*.json", "tools/build-frontend.mjs", "tools/demo-html.mjs", "tools/build-demo.mjs", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - run: node tools/build-demo.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
