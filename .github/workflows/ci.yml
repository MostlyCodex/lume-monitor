name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: go test ./...
      - run: go vet ./...

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Run repeatable Agent benchmark
        run: bash scripts/benchmark-agent.sh "$RUNNER_TEMP/yuanshan-benchmark"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/yuanshan-benchmark
          if-no-files-found: error
          retention-days: 30
