name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - name: Verify Agent upgrade, rollback and backup retention
        run: |
          sh ../deploy/test-upgrade-retention.sh
          sh ../deploy/test-agent-upgrade.sh
          sh ../deploy/test-agent-audit.sh
          sh ../deploy/test-agent-uninstall.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: go test ./...
      - run: go vet ./...

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      # Install the shared tests and the Worker/frontend build toolchain.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: .
      - run: npm run test:ci
      - name: Upload browser visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-${{ github.sha }}
          path: |
            worker/playwright-report
            worker/test-results/playwright
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Run repeatable Agent benchmark
        run: bash scripts/benchmark-agent.sh "$RUNNER_TEMP/lume-benchmark"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/lume-benchmark
          if-no-files-found: error
          retention-days: 30
